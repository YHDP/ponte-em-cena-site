name: Refresh Instagram feed

# Pulls @in.pulsobr's latest posts via the Instagram Graph API (server-side),
# bakes self-hosted thumbnails into assets/instagram/, regenerates the static
# gallery section in index.html, and commits — GitHub Pages then redeploys.
# Visitors never contact Meta; the only Meta call happens here in CI.
#
# Until the IG_TOKEN secret is set, the script runs in fixture mode and makes no
# changes (safe no-op). See scripts/README.md for the one-time setup.

on:
  schedule:
    - cron: '0 6 * * 1'      # weekly, Mondays 06:00 UTC — keeps the 60-day token alive
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch posts + rebuild gallery section
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_BASE: ${{ secrets.GRAPH_BASE }}
          IG_TOKEN_OUT: .ig-new-token
        run: node scripts/fetch-instagram.mjs

      - name: Persist refreshed token back to the IG_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s .ig-new-token ] && [ -n "$GH_TOKEN" ]; then
            gh secret set IG_TOKEN --body "$(cat .ig-new-token)"
            echo "IG_TOKEN secret rotated."
          else
            echo "No token rotation (no GH_PAT or no new token)."
          fi
          rm -f .ig-new-token

      - name: Commit refreshed feed
        run: |
          rm -f .ig-new-token
          if [ -n "$(git status --porcelain assets/instagram index.html)" ]; then
            git config user.name  "ponte-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/instagram index.html
            git commit -m "chore: refresh Instagram feed [skip ci]"
            git push
          else
            echo "No feed changes."
          fi
