<!DOCTYPE html>
<!--
  Ponte em Cena — public site.
  Conexões Culturais 2026 · 200 Anos de Amizade NL ⇄ BR.

  GENERATED by tools/build.py from _src/. Do not hand-edit the built pages —
  edit _src/shell.html, _src/styles.css or _src/pages/<lang>/<slug>.html and
  rebuild. The one exception is the IG:START/IG:END region, which
  scripts/fetch-instagram.mjs rewrites in place.

  Privacy posture: no cookies, no third-party tracker, no third-party fonts or
  embeds. Analytics is a first-party script posting to our own EU-hosted
  Supabase backend, which is disclosed as a sub-processor on /privacidade/.
  Fonts self-hosted (see fonts/NOTICE.md).

  Realização: Regen Studio · (in)PULSO. Apoio: Reino dos Países Baixos
  · 200 Anos de Amizade Brasil–Países Baixos.
-->
<html lang="{{HTML_LANG}}" data-langs="{{AVAILABLE_LANGS}}" data-langs-planned="{{PLANNED_LANGS}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- frame-ancestors is deliberately absent: it is ignored when delivered via
     <meta> (the browser logs a console warning saying so), and GitHub Pages
     gives us no way to set a real response header. Anti-framing therefore
     cannot be enforced from here. Acceptable for a static informational site
     with no forms, no auth and no state worth hijacking; revisit if any of
     that changes. Same reason X-Content-Type-Options is not here either. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'{{CSP_CONNECT}}; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'self'">
<meta name="author" content="Ponte em Cena">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{ROBOTS}}
{{CANONICAL_TAG}}{{HREFLANG}}

<link rel="icon" type="image/svg+xml" href="{{P}}assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{P}}assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{P}}assets/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:site_name" content="Ponte em Cena">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{BASE}}/assets/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">
<meta name="twitter:image" content="{{BASE}}/assets/og-image.png">

<link rel="preload" href="{{P}}fonts/spacegrotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{P}}fonts/gelasio-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{P}}ponte-tokens.css">
<link rel="stylesheet" href="{{P}}styles.css">

<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<a class="skip-link" href="#main-content">{{S_SKIP}}</a>

<div class="grad"></div>

<header class="site-head">
  <div class="wrap site-head__in">
    <a class="site-head__brand" href="{{HOME}}" aria-label="Ponte em Cena">
      <img src="{{P}}assets/ponte-logo-color.svg" width="200" height="84" alt="">
      <span>Ponte em Cena</span>
    </a>
    <nav class="site-nav" aria-label="{{S_NAV_LABEL}}">
      <ul class="nav__links">{{NAV}}</ul>
      <div class="nav__actions">{{SWITCHER}}</div>
    </nav>
  </div>
</header>

<main id="main-content">
{{CONTENT}}
</main>

<footer>
  <div class="wrap">
    <!-- No funder band and no project mark here (removed 2026-08-11). The
         mandatory funder co-brand zone lives in the hero instead; see
         _src/pages/<lang>/home.html and the .hero .apoio-row block in
         styles.css. Do not delete it from there without putting it somewhere
         else: BRAND.md makes the zone mandatory on every outward artifact. -->
    <div class="ft">
      <span class="meta">{{S_FOOTER_META}}</span>
      <nav class="ft-links" aria-label="{{S_FOOTER_NAV}}">{{FOOTER_LINKS}}</nav>
    </div>
    <p class="updated">{{S_UPDATED}} <time datetime="{{UPDATED_ISO}}">{{UPDATED_HUMAN}}</time>
      <span class="credit">· {{S_CREDIT}}</span></p>
  </div>
</footer>

<script src="{{P}}assets/js/i18n.js" defer></script>
<script src="{{P}}assets/js/panels.js" defer></script>
<script src="{{P}}assets/js/mapframe.js" defer></script>
{{TRACKER}}
</body>
</html>
