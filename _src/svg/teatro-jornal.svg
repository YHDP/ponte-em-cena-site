" stroke-width="1.4"/><text x="414" y="141" text-anchor="middle" font-size="9.5" font-weight="700" fill="#005A24">jornal BR</text><text x="370" y="172" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3D3D3D">o mesmo tema, lado a lado</text><line x1="480" y1="128" x2="532" y2="128" stroke="#9E7400" stroke-width="2.5"/><polygon points="538,128 531,123 531,133" fill="#9E7400"/><text x="640" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#757169">A CENA</text><rect x="548" y="44" width="172" height="150" rx="10" fill="#D6EBDD" stroke="#007F33" stroke-width="2"/><text x="634" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A"><tspan x="634" dy="0">imagens</tspan><tspan x="634" dy="15">e cenas a partir</tspan><tspan x="634" dy="15">do material</tspan></text><rect x="566" y="138" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#007F33" stroke-width="1.4"/><text x="634" y="152" text-anchor="middle" font-size="9.5" font-weight="700" fill="#005A24"><tspan x="634" dy="0">investigada</tspan><tspan x="634" dy="11">coletivamente</tspan></text><rect x="20" y="274" width="720" height="30" rx="15" fill="#1A1A1A"/><text x="380.0" y="293" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">A informação deixa de ser recebida como algo neutro</text></svg>
